name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: taskdaemon-sample-ci
      TASKDAEMON_IMAGE: mshelia/taskdaemon:0.2.0-alpha
      API_URL: http://localhost:8081
      DAEMON_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false

      - name: Initialize and verify public SDK only
        run: |
          git submodule update --init libs/taskdaemon-handlers
          cmp handlers/prime/taskdaemon.hpp libs/taskdaemon-handlers/cpp/include/taskdaemon.hpp

      - name: Test completion checker
        run: python3 -W error::ResourceWarning -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start published sample
        run: |
          docker compose pull taskdaemon
          docker compose up --build --wait --wait-timeout 180

      - name: Verify smoke task
        run: scripts/smoke-test.sh

      - name: Verify bounded load
        env:
          TASKS: "100"
          CONCURRENCY: "4"
          LIMIT: "1000000"
          TIMEOUT: "120"
        run: ./load-test.sh

      - name: Capture service logs
        if: always()
        run: docker compose logs --no-color

      - name: Clean up containers and persistence
        if: always()
        run: |
          cleanup_status=0
          docker compose down --volumes --remove-orphans --timeout 20 || cleanup_status=$?
          mapfile -t handler_containers < <(docker ps -aq --filter ancestor=prime-handler:latest)
          if (( ${#handler_containers[@]} )); then
            docker rm -f "${handler_containers[@]}" || cleanup_status=$?
          fi
          exit "$cleanup_status"
